name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable-workflow entry. Lets release.yml (and future
  # downstream callers) use this whole pipeline as a gate via
  # `uses: ./.github/workflows/ci.yml`. Without this trigger the
  # `uses:` from release.yml fails at workflow-resolution time.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # The agnos build runs under mirshi (AGNOS→Linux syscall translation,
      # github.com/MacCracken/mirshi). A test-harness pin, not the toolchain
      # — CLAUDE.md's "no hardcoded toolchain versions" is about cyrius,
      # whose pin stays in cyrius.cyml. The release binary is checked
      # against the release's own SHA256SUMS before it runs.
      MIRSHI_VERSION: "1.11.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version (CLAUDE.md "no hardcoded toolchain versions
        # in CI YAML") — read the pin and hand it to the upstream installer.
        #
        # Do NOT hand-roll this by untarring the release asset into
        # $HOME/.cyrius/{bin,lib}: that is the pre-6.5 layout, and it is what
        # this step replaced at v1.3.1. From 6.5.x `cyrius deps` resolves the
        # stdlib snapshot from $HOME/.cyrius/versions/$CYRIUS_VERSION/lib and
        # hard-fails with "pins version X but it is not installed" if only the
        # flattened dirs exist. The installer lays out versions/<v>/{bin,lib}
        # and symlinks bin/ + lib/ at it, and additionally does SHA256 +
        # signature verification the hand-rolled block skipped. Same pattern
        # as darshana / patra / libro.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Lint
        # v1.4.1: zero warnings, every file. Through v1.4.0 the gate
        # exempted every "exceeds 120 characters" line (its comment said
        # comment dividers only, but code lines in main.cyr took the
        # exemption) and grepped only `warn `, so a lint `error` passed.
        # Every src file is clean now; keep it that way. cyrius lint
        # exits non-zero on any output, so it is wrapped in `|| true`.
        run: |
          fail=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            bad=$(echo "$out" | grep -E '^\s*(warn|error)' || true)
            if [ -n "$bad" ]; then
              fail=1
            fi
            echo "$out" | grep -q '0 warnings' || fail=1
          done
          [ $fail -eq 0 ] || { echo "lint: warnings or errors present"; exit 1; }

      - name: Vet includes
        # Audits the include graph from the entry point. Fails on
        # untrusted or missing deps. Cheap, catches typos in
        # `include "src/foo.cyr"` paths.
        run: cyrius vet src/main.cyr

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Golden examples (docs/examples/README.md)
        # v1.4.2: the examples doc is generated from the binary
        # (tests/examples.sh) and must match what is committed — v1.4.1
        # found it showing a layout darshini cannot produce. Runs right
        # after Build, before any step can add entries to the checkout.
        # On a mismatch: `sh tests/examples.sh > docs/examples/README.md`.
        run: |
          set -e
          sh tests/examples.sh > /tmp/examples.md
          diff -u docs/examples/README.md /tmp/examples.md \
            || { echo "docs/examples/README.md is stale — regenerate with tests/examples.sh"; exit 1; }

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Fuzz
        # v1.4.1: the harness (tests/darshini.fcyr) has called itself a CI
        # gate since v1.3.3 but no step ran it. Six targets with named
        # invariants, deterministic seed; exits 1 on any violation.
        run: cyrius fuzz

      - name: Cross-target build (agnos, aarch64)
        # Binaries, suites and fuzz harnesses for both cross targets; the
        # next two steps run them.
        run: |
          set -e
          for t in agnos aarch64; do
            cyrius build --$t src/main.cyr build/darshini-$t
            cyrius build --$t tests/darshini.tcyr build/tests-$t
            cyrius build --$t tests/darshini.fcyr build/fuzz-$t
          done

      - name: aarch64 — suite, fuzz and output parity under qemu
        # v1.4.2. The aarch64 build is not yet a declared target, but its
        # output has matched x86_64's byte-for-byte since v1.4.0; this keeps
        # it that way: the full suite, the fuzz harness, and tests/parity.sh
        # (21 modes, pipe + PTY, bytes and exit codes) against the x86_64
        # binary. Through v1.4.1 CI only compiled it.
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user > /dev/null
          qemu-aarch64 build/tests-aarch64
          qemu-aarch64 build/fuzz-aarch64
          sh tests/parity.sh ./build/${{ github.event.repository.name }} "qemu-aarch64 ./build/${{ github.event.repository.name }}-aarch64"

      - name: agnos — suite and fuzz under mirshi
        # v1.4.2. agnos is a supported target and through v1.4.0 had no CI
        # gate; v1.4.1 compiled it. Now the suite (every assertion — the
        # two errno checks assert agnos's flat -1 there) and the fuzz
        # harness run under mirshi, plus a listing smoke of the agnos binary.
        run: |
          set -e
          D="$(mktemp -d)"
          base="https://github.com/MacCracken/mirshi/releases/download/$MIRSHI_VERSION"
          curl -sSfL -o "$D/mirshi" "$base/mirshi"
          curl -sSfL -o "$D/SHA256SUMS" "$base/SHA256SUMS"
          want=$(awk '$2 == "build/mirshi" || $2 == "mirshi" { print $1 }' "$D/SHA256SUMS")
          got=$(sha256sum "$D/mirshi" | awk '{ print $1 }')
          test -n "$want" && test "$want" = "$got" \
            || { echo "::error::mirshi $MIRSHI_VERSION checksum mismatch (want '$want', got '$got')"; exit 1; }
          chmod +x "$D/mirshi"
          "$D/mirshi" --root "$PWD" build/tests-agnos | tee /tmp/agnos_tests
          grep -qE '^[0-9]+ passed, 0 failed' /tmp/agnos_tests || { echo "agnos suite failed"; exit 1; }
          "$D/mirshi" --root "$PWD" build/fuzz-agnos
          "$D/mirshi" --root "$PWD" build/darshini-agnos -F src > /tmp/agnos_ls
          grep -qx 'main.cyr' /tmp/agnos_ls || { echo "agnos listing smoke failed:"; cat /tmp/agnos_ls; exit 1; }

      - name: Smoke — listing of the checkout
        # M1 acceptance check: built binary actually lists the
        # working tree and surfaces the expected scaffold files in
        # alphabetical (case-insensitive) order. Catches the class
        # of regressions where build + test pass but the binary
        # segfaults, emits garbage (e.g. the 0xed bug from M1's
        # var-buf-sizing gotcha), or skips entries.
        run: |
          set -e
          ./build/${{ github.event.repository.name }} > /tmp/listing
          for expected in cyrius.cyml VERSION README.md CHANGELOG.md src tests; do
            if ! grep -qx "$expected" /tmp/listing; then
              echo "missing '$expected' in listing:"
              cat /tmp/listing
              exit 1
            fi
          done

      - name: Smoke — error paths
        # Nonexistent path → exit 1 with stderr message. Locks in
        # the M1 contract that error paths surface non-zero exit so
        # shell pipelines using darshini don't silently swallow
        # missing-path bugs.
        run: |
          set +e
          out=$(./build/${{ github.event.repository.name }} /this/path/does/not/exist 2>&1)
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "expected exit 1 on missing path, got $rc"; echo "stderr: $out"; exit 1; }
          echo "$out" | grep -q "no such file or directory" || { echo "missing-path message not surfaced; got: $out"; exit 1; }

      - name: Smoke — write errors produce a non-zero exit
        # v1.3.3 contract. Through v1.3.2 every sys_write return was
        # discarded, so `darshini > out.txt` on a full filesystem
        # wrote nothing and still exited 0 — a calling script saw
        # success. /dev/full always fails writes with ENOSPC and needs
        # no privileges, so it is the exact reproduction. Also checks a
        # closed stdout (EBADF), and that a healthy run is unaffected.
        run: |
          set -e
          B=./build/${{ github.event.repository.name }}
          for mode in "" "-l" "-T" "--git"; do
            set +e
            $B $mode src > /dev/full 2>/tmp/werr
            rc=$?
            set -e
            test "$rc" -ne 0 || { echo "ENOSPC with '$mode' exited 0, expected non-zero"; exit 1; }
            grep -q "write error" /tmp/werr \
              || { echo "no write-error diagnostic for '$mode': $(cat /tmp/werr)"; exit 1; }
          done
          # v1.4.1: --help / --version too — they returned before the
          # write-error check, so `darshini --help > /dev/full` exited 0.
          for meta in --help --version; do
            set +e
            $B $meta > /dev/full 2>/tmp/werr
            rc=$?
            set -e
            test "$rc" -ne 0 || { echo "$meta to /dev/full exited 0"; exit 1; }
          done
          set +e
          $B src >&- 2>/tmp/werr2
          rc=$?
          set -e
          test "$rc" -ne 0 || { echo "closed stdout exited 0, expected non-zero"; exit 1; }
          # A healthy run must still be exit 0 with no diagnostic.
          $B src > /tmp/ok.txt 2>/tmp/noerr
          test -s /tmp/ok.txt || { echo "healthy run wrote nothing"; exit 1; }
          test ! -s /tmp/noerr || { echo "healthy run emitted stderr: $(cat /tmp/noerr)"; exit 1; }

      - name: "Smoke — multi-path: dirs get headers + blanks between"
        # v1.1.1 contract. Two-dir invocation produces a
        # `src:` header, blank line, then `tests:` header.
        # Single-path invocation MUST NOT emit any header
        # (byte-identical to v1.1.0 for back-compat).
        run: |
          set -e
          ./build/${{ github.event.repository.name }} src tests > /tmp/multi
          grep -q "^src:$" /tmp/multi \
            || { echo "no 'src:' header in multi-path output:"; cat /tmp/multi; exit 1; }
          grep -q "^tests:$" /tmp/multi \
            || { echo "no 'tests:' header in multi-path output:"; cat /tmp/multi; exit 1; }
          ./build/${{ github.event.repository.name }} src > /tmp/single
          if grep -q "^src:$" /tmp/single; then
            echo "single-path leaked a header (regression vs v1.1.0):"
            cat /tmp/single
            exit 1
          fi
          # `-d` multi-path: no headers, one line per path.
          out=$(./build/${{ github.event.repository.name }} -d src tests | tr '\n' ' ')
          test "$out" = "src tests " \
            || { echo "-d multi-path mismatch: '$out'"; exit 1; }

      - name: Smoke — --help / --version exit 0 with expected output
        # v1.1 contract: both meta flags exit 0 + print to stdout.
        # --version output is exactly "darshini X.Y.Z\n", where X.Y.Z
        # is the VERSION file — since v1.4.1 the binary takes it from
        # CYRIUS_PKG_VERSION (cyrius.cyml reads VERSION), so this checks
        # that chain end to end.
        run: |
          set -e
          want="darshini $(cat VERSION)"
          out=$(./build/${{ github.event.repository.name }} --version)
          test "$out" = "$want" || { echo "--version mismatch: got '$out', want '$want'"; exit 1; }
          ./build/${{ github.event.repository.name }} --help > /tmp/help
          grep -q "^usage: darshini" /tmp/help \
            || { echo "--help missing usage line:"; cat /tmp/help; exit 1; }
          grep -q "^  -F " /tmp/help \
            || { echo "--help missing -F flag doc:"; cat /tmp/help; exit 1; }

      - name: Smoke — -F appends classify indicators
        # v1.1 contract: dirs get `/`, executables `*`, symlinks `@`,
        # fifos `|`, sockets `=`. v1.4.1: a file with no indicator gets
        # NOTHING after its name outside the multi-column grid (through
        # v1.4.0 a pad space trailed it — `darshini -F | while IFS= read
        # -r f` read "CHANGELOG.md "), and path ARGUMENTS get their
        # indicator too (through v1.4.0 they got none).
        run: |
          set -e
          B="$PWD/build/${{ github.event.repository.name }}"
          "$B" -F > /tmp/classify
          grep -q '^src/$' /tmp/classify \
            || { echo "no 'src/' classify in -F output:"; cat /tmp/classify; exit 1; }
          grep -q '^CHANGELOG\.md$' /tmp/classify \
            || { echo "plain file must have no indicator and no pad:"; cat -A /tmp/classify; exit 1; }
          if grep -q ' $' /tmp/classify; then
            echo "-F left trailing whitespace on a pipe:"; cat -A /tmp/classify; exit 1
          fi
          T="$(mktemp -d)"
          printf '#!/bin/sh\n' > "$T/run.sh"; chmod +x "$T/run.sh"
          mkfifo "$T/ff"; ln -s run.sh "$T/lnk"
          out=$("$B" -F "$T/run.sh" "$T/ff" "$T/lnk" | sed "s|$T/||" | tr '\n' ' ')
          test "$out" = "run.sh* ff| lnk@ " || { echo "argv -F indicators wrong: '$out'"; exit 1; }
          out=$("$B" -dF "$T/run.sh" | sed "s|$T/||")
          test "$out" = "run.sh*" || { echo "-dF on a file: '$out'"; exit 1; }

      - name: Smoke — `--` ends the flags
        # v1.4.1. Through v1.4.0 `--` was an unknown flag, so there was no
        # way to hand darshini a glob holding a name that starts with `-`.
        run: |
          set -e
          B="$PWD/build/${{ github.event.repository.name }}"
          T="$(mktemp -d)"; cd "$T"
          touch -- -l --help plain
          out=$("$B" -- -l --help plain | tr '\n' ' ')
          test "$out" = "-l --help plain " || { echo "-- mishandled: '$out'"; exit 1; }
          out=$("$B" -- | tr '\n' ' ')
          test "$out" = "--help -l plain " || { echo "bare -- should list cwd: '$out'"; exit 1; }

      - name: Smoke — an unreadable directory fails the run
        # v1.4.1. `-T` drew an unreadable subdirectory exactly like an
        # empty one and exited 0, while `darshini <that dir>` reported it
        # and exited 1. Now both report it on stderr and exit 1; the rest
        # of the tree still prints. (CI runs unprivileged, so chmod 000
        # is enforced.)
        run: |
          set -e
          B="$PWD/build/${{ github.event.repository.name }}"
          T="$(mktemp -d)"
          mkdir -p "$T/top/ok" "$T/top/locked"; touch "$T/top/ok/f" "$T/top/locked/hidden"
          chmod 000 "$T/top/locked"
          set +e
          "$B" -T "$T/top" > /tmp/tree_out 2> /tmp/tree_err
          rc=$?
          set -e
          chmod 755 "$T/top/locked"
          test "$rc" -eq 1 || { echo "unreadable subdir: expected exit 1, got $rc"; exit 1; }
          grep -q 'locked: permission denied' /tmp/tree_err || { echo "no diagnostic:"; cat /tmp/tree_err; exit 1; }
          grep -q 'f$' /tmp/tree_out || { echo "readable part of the tree missing:"; cat /tmp/tree_out; exit 1; }
          if grep -q hidden /tmp/tree_out; then echo "listed a file it cannot read"; exit 1; fi

      - name: Smoke — hostile mtimes render as a placeholder
        # v1.4.1. A year past 9999 made `-l` emit raw terminal-control
        # bytes from the date (ESC 7 / ESC 8 at year ~235,700) and spin
        # for minutes per entry. Needs a filesystem that stores such an
        # mtime: tmpfs does (/dev/shm); ext4 caps at 2446, so the gate
        # skips if the timestamp did not stick.
        run: |
          set -e
          B="$PWD/build/${{ github.event.repository.name }}"
          T="$(mktemp -d -p /dev/shm 2>/dev/null || mktemp -d)"
          touch -d @7376000000000 "$T/f" 2>/dev/null || true
          if [ "$(stat -c %Y "$T/f" 2>/dev/null)" != "7376000000000" ]; then
            echo "filesystem cannot hold the mtime; skipping"; exit 0
          fi
          timeout 10 "$B" -l "$T" > /tmp/mt
          if od -An -tx1 /tmp/mt | grep -qE ' (1b|9b)( |$)'; then echo "control byte from an mtime:"; od -c /tmp/mt; exit 1; fi
          grep -q '????-??-?? ??:?? f$' /tmp/mt || { echo "no placeholder:"; cat /tmp/mt; exit 1; }

      - name: Smoke — -d renders single entry for dir
        # v1.1 contract: -d echoes path verbatim, -dF appends /,
        # -ld renders one long-format row.
        run: |
          set -e
          out=$(./build/${{ github.event.repository.name }} -d src)
          test "$out" = "src" || { echo "-d src mismatch: $out"; exit 1; }
          out=$(./build/${{ github.event.repository.name }} -dF src)
          test "$out" = "src/" || { echo "-dF src mismatch: $out"; exit 1; }

      - name: Smoke — --mime column under -l surfaces expected types
        # M8 contract: `darshini -l --mime` shows mime types
        # for the listing — text/markdown for .md, application/x-cyml
        # for .cyml, inode/directory for dirs. Acceptance per
        # roadmap M8: text/markdown + application/x-cyrius +
        # application/x-executable visible.
        # `--mime` without -l is parsed but renders no column.
        run: |
          set -e
          ./build/${{ github.event.repository.name }} -l --mime > /tmp/mime_long
          grep -qE 'text/markdown +CLAUDE\.md$' /tmp/mime_long \
            || { echo "no text/markdown for CLAUDE.md:"; cat /tmp/mime_long; exit 1; }
          grep -qE 'application/x-cyml +cyrius\.cyml$' /tmp/mime_long \
            || { echo "no application/x-cyml for cyrius.cyml:"; cat /tmp/mime_long; exit 1; }
          grep -qE 'inode/directory +docs$' /tmp/mime_long \
            || { echo "no inode/directory for docs/:"; cat /tmp/mime_long; exit 1; }
          # The rest of the M8 acceptance list (asserted since v1.4.1).
          ./build/${{ github.event.repository.name }} -l --mime src > /tmp/mime_src
          grep -qE 'application/x-cyrius +main\.cyr$' /tmp/mime_src \
            || { echo "no application/x-cyrius for main.cyr:"; cat /tmp/mime_src; exit 1; }
          ./build/${{ github.event.repository.name }} -l --mime build > /tmp/mime_build
          grep -qE 'application/x-executable +${{ github.event.repository.name }}$' /tmp/mime_build \
            || { echo "no application/x-executable for the binary:"; cat /tmp/mime_build; exit 1; }
          # v1.4.1: -l --mime on a FILE argument shows the column too.
          ./build/${{ github.event.repository.name }} -l --mime README.md > /tmp/mime_one
          grep -qE 'text/markdown README\.md$' /tmp/mime_one \
            || { echo "-l --mime <file> dropped the column:"; cat /tmp/mime_one; exit 1; }
          # --mime without -l: column suppressed; verify no mime
          # token leaked into the short-format listing.
          ./build/${{ github.event.repository.name }} --mime > /tmp/mime_short
          if grep -qE '(text|application|image|inode)/' /tmp/mime_short; then
            echo "--mime without -l leaked mime tokens:"
            cat /tmp/mime_short
            exit 1
          fi

      - name: Smoke — --git column in repo + silent outside
        # M7 contract: `darshini --git` in the project root
        # surfaces status chars — at least one tracked `.` and
        # at least one ignored `!`. We don't pin specific
        # filenames as "clean" because CHANGELOG.md / state.md
        # etc. may have been touched in the same checkout.
        # Outside a git repo (e.g. /tmp) the column silently
        # doesn't appear — listing matches a no-flag invocation.
        run: |
          set -e
          ./build/${{ github.event.repository.name }} --git > /tmp/git_in_repo
          grep -qE '^\. ' /tmp/git_in_repo \
            || { echo "no tracked '. ...' lines in --git output:"; cat /tmp/git_in_repo; exit 1; }
          grep -q '^! build$' /tmp/git_in_repo \
            || { echo "no '! build' (ignored) in --git output:"; cat /tmp/git_in_repo; exit 1; }
          # Outside a repo — no column. /tmp may have varying
          # contents on CI runners; just assert no line starts
          # with a status-char + space pattern.
          ./build/${{ github.event.repository.name }} --git /tmp > /tmp/git_outside
          if grep -qE '^[.M?!] ' /tmp/git_outside; then
            echo "outside-repo --git leaked status chars:"
            cat /tmp/git_outside
            exit 1
          fi

      - name: Smoke — --git agrees with git (index v2/v3/v4, sha256, file args, ..)
        # v1.4.1. Through v1.4.0: a v3 / v4 / SHA-256 index produced a
        # column of '?' (the parse failure was ignored); `-l --git <file>`
        # showed '?' for every file; and a `..` in the path broke every
        # lookup. Builds each case with real git and checks a tracked file
        # reads '.'.
        run: |
          set -e
          B="$PWD/build/${{ github.event.repository.name }}"
          T="$(mktemp -d)"
          mkrepo() {
            git init -q "$@" && git -C "$1" config user.email ci@ci && git -C "$1" config user.name ci
            mkdir -p "$1/src/sub"; echo a > "$1/a.txt"; echo c > "$1/src/c.txt"; echo d > "$1/src/sub/d.txt"
            git -C "$1" add -A && git -C "$1" commit -qm init
          }
          for v in 2 3 4; do
            mkrepo "$T/v$v"; git -C "$T/v$v" update-index --index-version $v
            "$B" --git "$T/v$v" | grep -qx '\. a\.txt' || { echo "index v$v:"; "$B" --git "$T/v$v"; exit 1; }
          done
          if git init -q --object-format=sha256 "$T/probe" 2>/dev/null; then
            mkrepo "$T/sha" --object-format=sha256
            "$B" --git "$T/sha" | grep -qx '\. a\.txt' || { echo "sha256 repo:"; "$B" --git "$T/sha"; exit 1; }
          fi
          (cd "$T/v2" && "$B" -l --git a.txt src/c.txt) > /tmp/git_files
          test "$(grep -c ' \. ' /tmp/git_files)" -eq 2 || { echo "-l --git <file>:"; cat /tmp/git_files; exit 1; }
          (cd "$T/v2/src/sub" && "$B" --git ..) | grep -qx '\. c\.txt' \
            || { echo "--git ..:"; (cd "$T/v2/src/sub" && "$B" --git ..); exit 1; }

      - name: Smoke — tree mode produces box-drawn output
        # M6 contract: `-T` recurses with box-drawing connectors.
        # Greps for the actual connector bytes (├ = e2 94 9c,
        # └ = e2 94 94) in the output, then verifies that
        # --level 1 limits depth (a single level should NOT
        # contain ANY connectors from a deeper-than-1 path —
        # we test by listing `docs` at --level 1 and checking
        # that no grandchildren appear in the output).
        run: |
          set -e
          ./build/${{ github.event.repository.name }} -T docs > /tmp/tree
          od -An -tx1 /tmp/tree | grep -q -E ' e2 94 9c ' \
            || { echo "tree output missing ├ connector:"; cat /tmp/tree; exit 1; }
          od -An -tx1 /tmp/tree | grep -q -E ' e2 94 94 ' \
            || { echo "tree output missing └ connector:"; cat /tmp/tree; exit 1; }
          # --level 1 on docs: shows docs + its direct children
          # (adr / architecture / development / examples / guides)
          # but NOT their contents (no roadmap.md, no
          # 0001-color-scheme.md, etc.). Negative grep.
          ./build/${{ github.event.repository.name }} -T --level 1 docs > /tmp/tree1
          grep -q "adr" /tmp/tree1 || { echo "--level 1 dropped adr/:"; cat /tmp/tree1; exit 1; }
          if grep -q "roadmap.md" /tmp/tree1; then
            echo "--level 1 leaked grandchildren:"
            cat /tmp/tree1
            exit 1
          fi

      - name: Smoke — pipe emits no icon glyphs
        # M5 contract: pipe → no Nerd Font PUA bytes. Same
        # principle as the color escape suppression — script
        # consumers see plain bytes only. Nerd Font glyphs are
        # in the U+E000–U+F8FF Private Use Area; their UTF-8
        # encodings start with `\xee` or `\xef` so an `od`
        # byte-scan catches a leak (PCRE in text mode misreads
        # the multi-byte sequence as a single char).
        run: |
          set -e
          ./build/${{ github.event.repository.name }} > /tmp/no_icons
          if od -An -tx1 /tmp/no_icons | grep -q -E ' (ee|ef) '; then
            echo "pipe output contained Nerd Font PUA bytes:"
            cat -v /tmp/no_icons
            exit 1
          fi

      - name: Smoke — TTY emits icons, --no-icons suppresses
        # M5 contract: TTY default shows icons; `--no-icons`
        # suppresses them under TTY. Tests both directions.
        run: |
          set -e
          script -qec "./build/${{ github.event.repository.name }}" /dev/null > /tmp/tty_icons
          od -An -tx1 /tmp/tty_icons | grep -q -E ' (ee|ef) ' || {
            echo "TTY-attached output had no Nerd Font PUA bytes (icons not firing):"
            cat -v /tmp/tty_icons
            exit 1
          }
          script -qec "./build/${{ github.event.repository.name }} --no-icons" /dev/null > /tmp/tty_no_icons
          if od -An -tx1 /tmp/tty_no_icons | grep -q -E ' (ee|ef) '; then
            echo "--no-icons failed to suppress Nerd Font PUA bytes:"
            cat -v /tmp/tty_no_icons
            exit 1
          fi

      - name: Smoke — pipe emits no color escapes
        # M4 contract: pipe → no SGR escapes (not just no column
        # layout, no color either). A regression that leaks `\x1b[`
        # into pipe output would be a CLAUDE.md hard-rule violation
        # (color must never reach a script consumer).
        run: |
          set -e
          ./build/${{ github.event.repository.name }} > /tmp/plain
          if grep -qP '\x1b\[' /tmp/plain; then
            echo "pipe output contained ANSI escapes:"
            cat -v /tmp/plain
            exit 1
          fi

      - name: Smoke — TTY emits color, --no-color suppresses
        # M4 contract: TTY-attached stdout shows escapes;
        # `--no-color` suppresses them even under TTY. Uses
        # `script -qec` to allocate a pty for the child.
        run: |
          set -e
          script -qec "./build/${{ github.event.repository.name }}" /dev/null > /tmp/tty_colored
          grep -qP '\x1b\[' /tmp/tty_colored || {
            echo "TTY-attached output had no ANSI escapes (color not firing):"
            cat -v /tmp/tty_colored
            exit 1
          }
          script -qec "./build/${{ github.event.repository.name }} --no-color" /dev/null > /tmp/tty_plain
          if grep -qP '\x1b\[' /tmp/tty_plain; then
            echo "--no-color failed to suppress ANSI escapes:"
            cat -v /tmp/tty_plain
            exit 1
          fi

      - name: Smoke — untrusted names are neutralized on a TTY, raw on a pipe
        # v1.4.0 security contract. A filename is attacker-controlled, and
        # written raw to a terminal it executes control sequences. Covers
        # every way a name reaches the terminal: a listing (plain, -1, -l,
        # -T, -F), argv paths echoed as non-directories (`darshini *`),
        # `-d`, the multi-path `<dir>:` header, and a path quoted in an
        # error message (also with stdout redirected, so the TTY is stderr
        # alone). Through v1.3.4 the last four went out raw, and a raw
        # 8-bit CSI (0x9b) got through even in a listing. With
        # `--no-color --no-icons` darshini emits no ESC of its own, so ANY
        # 0x1b or 0x9b byte in the output is an injection. On a pipe the
        # true bytes must still arrive, so a script gets a name that opens.
        run: |
          set -e
          B="$PWD/build/${{ github.event.repository.name }}"
          T="$(mktemp -d)"
          cd "$T"
          touch "$(printf 'a\033[2Jx')" "$(printf 'c1\302\233x')" "$(printf 'r\233x')" "$(printf 'b\033]0;t\007')"
          mkdir "$(printf 'd\033[1A\033[2Kx')" "$(printf 'n\033[1Ax')"
          chmod 000 "$(printf 'n\033[1Ax')"
          inject() {   # $1 = label, $2 = captured output
            if od -An -tx1 "$2" | grep -qE ' (1b|9b)( |$)'; then
              echo "terminal-control byte reached the TTY ($1):"; od -c "$2"; exit 1
            fi
          }
          for mode in "" "-1" "-l" "-T" "-F" "-lF"; do
            # `-T` exits 1 here since v1.4.1 (the mode-000 dir is reported,
            # not drawn as empty); this gate is about bytes, not status.
            script -qec "$B --no-color --no-icons $mode" /dev/null > out || true
            inject "listing '$mode'" out
          done
          script -qec "$B --no-color --no-icons ./a* ./c1* ./r*" /dev/null > out
          inject "argv paths echoed as non-directories" out
          script -qec "$B --no-color --no-icons -d ./*" /dev/null > out
          inject "-d echo" out
          script -qec "$B --no-color --no-icons -l ./a* ./c1* ./r*" /dev/null > out
          inject "-l of argv paths" out
          script -qec "$B --no-color --no-icons -T ./d*" /dev/null > out
          inject "-T root line" out
          script -qec "$B --no-color --no-icons ./d* ./a*" /dev/null > out
          inject "multi-path header" out
          script -qec "$B --no-color --no-icons ./n*" /dev/null > out || true   # exits 1: permission denied
          inject "error message" out
          script -qec "$B --no-color --no-icons ./n* > /dev/null" /dev/null > out || true
          inject "error message, stdout redirected" out
          grep -q 'permission denied' out || { echo "error path not exercised:"; od -c out; exit 1; }
          # What the user sees: one `?` per neutralized byte or sequence.
          script -qec "$B --no-color --no-icons -1" /dev/null | tr -d '\r' > out
          grep -qx 'a?\[2Jx' out || { echo "ESC not shown as ?"; od -c out; exit 1; }
          grep -qx 'c1?x' out    || { echo "encoded C1 not shown as one ?"; od -c out; exit 1; }
          grep -qx 'r?x' out     || { echo "raw 0x9b not shown as ?"; od -c out; exit 1; }
          # Pipe: the true bytes, unchanged.
          "$B" -1 > out
          grep -qx "$(printf 'a\033\\[2Jx')" out || { echo "pipe altered a name"; od -c out; exit 1; }
          chmod 755 "$(printf 'n\033[1Ax')"

      - name: Smoke — pipe is single column
        # M3 contract: stdout-not-a-TTY → one entry per line.
        # `wc -l` on the listing should equal the entry count;
        # `awk '{print NF}'` on each line should be 1 (one field).
        # Catches regressions that would emit columns into a
        # pipe (a CLAUDE.md hard rule violation).
        run: |
          set -e
          ./build/${{ github.event.repository.name }} > /tmp/pipe
          lines=$(wc -l < /tmp/pipe)
          test "$lines" -gt 5 || { echo "expected >5 entries in checkout listing, got $lines"; exit 1; }
          awk 'NF != 1 { print "multi-field line:", $0; bad=1 } END { exit bad+0 }' /tmp/pipe \
            || { echo "pipe output had multi-field lines"; cat /tmp/pipe; exit 1; }

      - name: Smoke — -1 forces single column under TTY
        # `script -qec CMD /dev/null` allocates a pty so the child
        # sees a TTY on stdout. Without -1, the column layout would
        # kick in; with -1, single column wins. Locks in the
        # `-1` override semantics.
        #
        # `--no-color --no-icons` strips the M4/M5 decoration that
        # would otherwise turn each line into a multi-field
        # `<ESC>[34m<icon-bytes> name<ESC>[0m` shape (awk's
        # default FS splits on whitespace and sees the inner
        # space as a field boundary). The structural check here
        # is "one entry per line"; decoration smokes test the
        # decoration paths separately.
        run: |
          set -e
          script -qec "./build/${{ github.event.repository.name }} -1 --no-color --no-icons" /dev/null > /tmp/single
          tr -d '\r' < /tmp/single > /tmp/single.clean
          awk 'NF != 1 { bad=1 } END { exit bad+0 }' /tmp/single.clean \
            || { echo "-1 produced multi-field lines under TTY (decoration stripped):"; cat /tmp/single.clean; exit 1; }
          lines=$(wc -l < /tmp/single.clean)
          test "$lines" -gt 5 || { echo "expected >5 entries under -1, got $lines"; exit 1; }

      - name: Smoke — long format -lh shape
        # M2 acceptance: `darshini -lh` produces aligned 4-column
        # rows (perms / size / mtime / name). Greps for a row
        # matching the exact column structure on a known file
        # (CHANGELOG.md) to lock in the perm-string, the human-
        # size suffix, and the UTC mtime YYYY-MM-DD HH:MM shape.
        run: |
          set -e
          ./build/${{ github.event.repository.name }} -lh > /tmp/long
          # Header row sanity: perms are 10 chars starting with -
          # or d/l/p/s/b/c; size has a digit; mtime matches the
          # YYYY-MM-DD HH:MM pattern; then a filename.
          grep -E '^[-dlpsbc][rwxstST-]{9} +[0-9]+(\.[0-9][KMGT])? [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} CHANGELOG\.md$' /tmp/long || {
            echo "no aligned CHANGELOG.md row matched in -lh output:"
            cat /tmp/long
            exit 1
          }
          # Unknown-flag rejection
          set +e
          out=$(./build/${{ github.event.repository.name }} -X 2>&1)
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "expected exit 1 on unknown flag, got $rc"; exit 1; }
          echo "$out" | grep -q "unknown flag" || { echo "unknown-flag message not surfaced; got: $out"; exit 1; }

      - name: DCE parity check
        # darshana runs the equivalent gate: a dead-code-eliminated
        # build (CYRIUS_DCE=1) must behave identically to the debug
        # build, or the DCE pass dropped a live symbol. The release
        # ships the DCE build. v1.4.1: compares every byte and the exit
        # code across a mode matrix, on a pipe and under a PTY — through
        # v1.4.0 it grepped six names out of one plain listing. The matrix
        # lives in tests/parity.sh (shared with the aarch64 gate) since
        # v1.4.2.
        run: |
          set -e
          N=build/${{ github.event.repository.name }}
          CYRIUS_DCE=1 cyrius build src/main.cyr $N-dce
          echo "$N-dce: $(wc -c < $N-dce) bytes"
          sh tests/parity.sh ./$N ./$N-dce

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for forbidden patterns in src/
        # darshini CLAUDE.md hard rules, scanned statically so a
        # regression can't merge. Rules mirror darshana/chakshu so the
        # AGNOS first-party stack stays uniformly hardened — adapted to
        # darshini's invariants (no exec, no inline ANSI, no git shell).
        run: |
          FAIL=0

          # No sys_system / exec_* — directory walk + stat + render
          # only (CLAUDE.md "Do not use sys_system() or exec_*").
          exec_hits=$(grep -rnE '\b(sys_system|exec_[a-z]+)\b' src/ 2>/dev/null || true)
          if [ -n "$exec_hits" ]; then
            echo "FAIL: sys_system/exec_* call in src/ (no subprocess execution allowed)"
            echo "$exec_hits"
            FAIL=1
          fi

          # No raw ANSI escape literals — every SGR/cursor sequence
          # MUST route through darshana (CLAUDE.md "no raw ANSI inline").
          # v1.4.1: also the uppercase hex, OSC, and 8-bit CSI spellings.
          ansi_hits=$(grep -rnE '\\x1[bB]|\\033|\\e\[|\\x9[bB]|\\233' src/ 2>/dev/null || true)
          if [ -n "$ansi_hits" ]; then
            echo "FAIL: raw ANSI escape literal in src/ — route via darshana tty_sgr"
            echo "$ansi_hits"
            FAIL=1
          fi

          # No git invoked as a subprocess — git status comes from
          # reading .git/ files directly (CLAUDE.md hard rule).
          git_hits=$(grep -rnE '"git[ "]|sys_system.*git|exec.*git' src/ 2>/dev/null || true)
          if [ -n "$git_hits" ]; then
            echo "FAIL: git subprocess reference in src/ — parse .git/ directly"
            echo "$git_hits"
            FAIL=1
          fi

          # No FFI / dynlib / pam imports (shared stack invariant).
          ffi_hits=$(grep -rnE 'include "lib/(cffi|dynlib|fdlopen|pam)\.cyr"' src/ 2>/dev/null || true)
          if [ -n "$ffi_hits" ]; then
            echo "FAIL: FFI/dynlib/pam library import in src/"
            echo "$ffi_hits"
            FAIL=1
          fi

          # Large stack buffers — same 64 KiB threshold owl/cyim/
          # chakshu/darshana use. darshini's biggest legitimate stack
          # buffers are the 4096-byte path-join buf and the 144-byte
          # stat buf; flag anything >= 64 KiB as a contributor mistake.
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr > /tmp/bigbuf.txt
          if [ -s /tmp/bigbuf.txt ]; then
            cat /tmp/bigbuf.txt
            FAIL=1
          fi

          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        # First-party documentation surface. Mirrors darshana's docs
        # gate, with darshini's actual ADR set (color-scheme is 0001).
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION LICENSE \
                   cyrius.cyml CLAUDE.md \
                   CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md \
                   docs/development/roadmap.md docs/development/state.md \
                   docs/adr/0001-color-scheme.md docs/adr/0002-icon-format.md \
                   docs/adr/0003-mime-detection.md docs/adr/0004-tree-mode.md \
                   docs/guides/getting-started.md icons/default.cyml mime/default.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Icon / mime tables match their CYML sources
        # v1.4.2. icons/default.cyml and mime/default.cyml are the
        # documented source of truth; src/icons.cyr and src/mime.cyr bake
        # the same tables. tests/table-drift.sh compares them entry by
        # entry (ADR 0002 deferred this "until drift becomes a problem";
        # v1.4.1 found the first one, `xlsx`). No toolchain needed.
        run: sh tests/table-drift.sh

      - name: Verify version consistency
        # Single source of truth is the VERSION file. Derived surfaces:
        # the CHANGELOG section header and the cyrius.cyml `${file:VERSION}`
        # indirection, which `cyrius build` turns into CYRIUS_PKG_VERSION
        # — what `--version` prints since v1.4.1 (it was a hand-bumped
        # literal). So src/main.cyr must use the constant and carry no
        # version literal of its own; the runtime --version smoke checks
        # the built binary end to end.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -qE "^## \[${VERSION}\]" CHANGELOG.md \
            || { echo "FAIL: CHANGELOG.md missing section [${VERSION}]"; exit 1; }
          grep -qE '^version *= *"\$\{file:VERSION\}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version no longer pulls from VERSION"; exit 1; }
          grep -q 'CYRIUS_PKG_VERSION' src/main.cyr \
            || { echo "FAIL: src/main.cyr no longer prints CYRIUS_PKG_VERSION"; exit 1; }
          if grep -qE '"darshini [0-9]+\.[0-9]+\.[0-9]+' src/*.cyr; then
            echo "FAIL: a hardcoded version literal is back in src/"; exit 1
          fi
          echo "Version consistent: VERSION = CHANGELOG = cyrius.cyml -> CYRIUS_PKG_VERSION = $VERSION"
